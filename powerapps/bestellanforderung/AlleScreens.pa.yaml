Screens:
  scrAntrag:
    Properties:
      Fill: =AppTheme.NearWhite
      LoadingSpinnerColor: =AppTheme.DarkBlue
      OnVisible: |
        =Set(varVorgesetzter, IfError('Office365-Benutzer'.ManagerV2(User().EntraObjectId), Blank()))
    Children:
      - Container_Header_A:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =AppTheme.OffWhite
            Height: =32
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingLeft: =12
            PaddingRight: =12
            Width: =Parent.Width
          Children:
            - Label_AppTitle_A:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =AppTheme.DarkGray
                  Size: =11
                  Text: ="Neuer Antrag"
                  Width: =Parent.Width
      - Container_Content_A:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =AppTheme.NearWhite
            Height: =Parent.Height - Container_Header_A.Height
            Width: =Parent.Width
            Y: =32
          Children:
            - Card_Antrag:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =AppTheme.PaleGray
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =AppTheme.White
                  Height: =620
                  Width: =620
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =20
                Children:
                  - lblAntragHeading:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkBlue
                        FontWeight: =FontWeight.Bold
                        Height: =30
                        Size: =18
                        Text: ="Bestellanforderung"
                        Width: =400
                        X: =24
                        Y: =16
                  - lblFachbereichLabel:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkGray
                        Height: =35
                        Text: ="Fachbereich *"
                        Width: =130
                        X: =24
                        Y: =64
                  - ddFachbereich:
                      Control: ModernDropdown@1.0.3
                      Properties:
                        Fill: =AppTheme.OffWhite
                        Height: =35
                        ItemDisplayText: =ThisItem.Value
                        Items: =["Produktion", "Qualität", "Beschaffung", "Instandhaltung", "Logistik", "Verwaltung"]
                        Width: =420
                        X: =164
                        Y: =64
                  - lblArtikelnummerLabel:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkGray
                        Height: =35
                        Text: ="Artikelnummer *"
                        Width: =130
                        X: =24
                        Y: =106
                  - txtArtikelnummer:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        Fill: =AppTheme.OffWhite
                        Height: =35
                        Placeholder: ="Artikelnummer"
                        Width: =420
                        X: =164
                        Y: =106
                  - lblStueckzahlLabel:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkGray
                        Height: =35
                        Text: ="Stückzahl *"
                        Width: =130
                        X: =24
                        Y: =148
                  - txtStueckzahl:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        Fill: =AppTheme.OffWhite
                        Height: =35
                        Placeholder: ="0"
                        Width: =200
                        X: =164
                        Y: =148
                  - lblWertLabel:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkGray
                        Height: =35
                        Text: ="Wert (€) *"
                        Width: =130
                        X: =24
                        Y: =190
                  - txtWert:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        Fill: =AppTheme.OffWhite
                        Height: =35
                        Placeholder: ="0,00"
                        Width: =200
                        X: =164
                        Y: =190
                  - lblWegHinweis:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.MidGray
                        Height: =35
                        Size: =10
                        Text: |-
                          =If(
                              IfError(Value(txtWert.Text), 0) > 5000,
                              "FK → Geschäftsführung → MaWi",
                              "FK → MaWi"
                          )
                        Width: =210
                        X: =374
                        Y: =190
                  - lblKostenstelleLabel:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkGray
                        Height: =35
                        Text: ="Kostenstelle"
                        Width: =130
                        X: =24
                        Y: =232
                  - txtKostenstelle:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        Fill: =AppTheme.OffWhite
                        Height: =35
                        Placeholder: ="Kostenstelle"
                        Width: =200
                        X: =164
                        Y: =232
                  - lblLagerortLabel:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkGray
                        Height: =35
                        Text: ="Wo liegt die Ware"
                        Width: =130
                        X: =24
                        Y: =274
                  - txtLagerort:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        Fill: =AppTheme.OffWhite
                        Height: =35
                        Placeholder: ="Lagerort"
                        Width: =420
                        X: =164
                        Y: =274
                  - lblVorgesetzterLabel:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkGray
                        Height: =35
                        Text: ="Vorgesetzter"
                        Width: =130
                        X: =24
                        Y: =316
                  - lblVorgesetzterWert:
                      Control: Label@2.5.1
                      Properties:
                        Color: =If(IsBlank(varVorgesetzter.mail), AppTheme.LightRed, AppTheme.DarkGray)
                        Height: =35
                        Text: =If(IsBlank(varVorgesetzter.mail), "Kein Vorgesetzter im AD hinterlegt", varVorgesetzter.displayName)
                        Width: =420
                        X: =164
                        Y: =316
                  - lblDateienLabel:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkGray
                        Height: =35
                        Text: ="Dateien"
                        Width: =130
                        X: =24
                        Y: =358
                  - btnAbsenden:
                      Control: ModernButton@1.0.0
                      Properties:
                        BasePaletteColor: =AppTheme.DarkBlue
                        DisplayMode: |-
                          =If(
                              !IsBlank(ddFachbereich.Selected.Value)
                                  && !IsBlank(Trim(txtArtikelnummer.Text))
                                  && IfError(Value(txtStueckzahl.Text), 0) > 0
                                  && IfError(Value(txtWert.Text), 0) > 0
                                  && !IsBlank(varVorgesetzter.mail),
                              DisplayMode.Edit,
                              DisplayMode.Disabled
                          )
                        Height: =35
                        OnSelect: |-
                          =Set(
                              varAntrag,
                              Patch(
                                  Antraege,
                                  Defaults(Antraege),
                                  {
                                      Titel: Trim(txtArtikelnummer.Text),
                                      Fachbereich: {Value: ddFachbereich.Selected.Value},
                                      Artikelnummer: Trim(txtArtikelnummer.Text),
                                      Stueckzahl: Value(txtStueckzahl.Text),
                                      Wert: Value(txtWert.Text),
                                      Kostenstelle: Trim(txtKostenstelle.Text),
                                      Lagerort: Trim(txtLagerort.Text),
                                      Status: {Value: "Wartet auf FK"},
                                      Antragsteller: {
                                          Claims: "i:0#.f|membership|" & User().Email,
                                          Department: "",
                                          DisplayName: User().FullName,
                                          Email: User().Email,
                                          JobTitle: "",
                                          Picture: ""
                                      },
                                      Vorgesetzter: {
                                          Claims: "i:0#.f|membership|" & varVorgesetzter.userPrincipalName,
                                          Department: "",
                                          DisplayName: varVorgesetzter.displayName,
                                          Email: varVorgesetzter.mail,
                                          JobTitle: "",
                                          Picture: ""
                                      }
                                  }
                              )
                          );
                          Notify("Antrag eingereicht.", NotificationType.Success);
                          Reset(ddFachbereich);
                          Reset(txtArtikelnummer);
                          Reset(txtStueckzahl);
                          Reset(txtWert);
                          Reset(txtKostenstelle);
                          Reset(txtLagerort);
                          Navigate(scrMeineAntraege, ScreenTransition.Fade)
                        Text: ="Antrag absenden"
                        Width: =200
                        X: =164
                        Y: =560
                  - btnZuruecksetzen:
                      Control: ModernButton@1.0.0
                      Properties:
                        BasePaletteColor: =AppTheme.MidGray
                        Height: =35
                        OnSelect: |-
                          =Reset(ddFachbereich);
                          Reset(txtArtikelnummer);
                          Reset(txtStueckzahl);
                          Reset(txtWert);
                          Reset(txtKostenstelle);
                          Reset(txtLagerort)
                        Text: ="Zurücksetzen"
                        Width: =200
                        X: =384
                        Y: =560
            - btnNavAntrag_A:
                Control: ModernButton@1.0.0
                Properties:
                  BasePaletteColor: =AppTheme.DarkBlue
                  Height: =35
                  OnSelect: =Navigate(scrAntrag, ScreenTransition.Fade)
                  Text: ="Neuer Antrag"
                  Width: =250
                  X: =10
                  Y: =30
            - btnNavMeine_A:
                Control: ModernButton@1.0.0
                Properties:
                  BasePaletteColor: =AppTheme.LightBlue
                  Height: =35
                  OnSelect: =Navigate(scrMeineAntraege, ScreenTransition.Fade)
                  Text: ="Meine Anträge"
                  Width: =250
                  X: =10
                  Y: =70
            - btnNavFreigaben_A:
                Control: ModernButton@1.0.0
                Properties:
                  BasePaletteColor: =AppTheme.LightBlue
                  Height: =35
                  OnSelect: =Navigate(scrFreigaben, ScreenTransition.Fade)
                  Text: ="Freigaben"
                  Width: =250
                  X: =10
                  Y: =110
  scrMeineAntraege:
    Properties:
      Fill: =AppTheme.NearWhite
      LoadingSpinnerColor: =AppTheme.DarkBlue
    Children:
      - Container_Header_M:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =AppTheme.OffWhite
            Height: =32
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingLeft: =12
            PaddingRight: =12
            Width: =Parent.Width
          Children:
            - Label_AppTitle_M:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =AppTheme.DarkGray
                  Size: =11
                  Text: ="Meine Anträge"
                  Width: =Parent.Width
      - Container_Content_M:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =AppTheme.NearWhite
            Height: =Parent.Height - Container_Header_M.Height
            Width: =Parent.Width
            Y: =32
          Children:
            - lblMeineHeading:
                Control: Label@2.5.1
                Properties:
                  Color: =AppTheme.DarkBlue
                  FontWeight: =FontWeight.Bold
                  Height: =30
                  Size: =18
                  Text: ="Meine Anträge"
                  Width: =400
                  X: =(Parent.Width - 620) / 2
                  Y: =20
            - galMeineAntraege:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  BorderColor: =AppTheme.PaleGray
                  BorderThickness: =1
                  Fill: =AppTheme.White
                  Height: =Parent.Height - Self.Y - 20
                  Items: |-
                    =Sort(
                        Filter(Antraege, Antragsteller.Email = User().Email),
                        ID,
                        SortOrder.Descending
                    )
                  TemplateSize: =70
                  Width: =620
                  X: =(Parent.Width - 620) / 2
                  Y: =60
                Children:
                  - lblNr_M:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkGray
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        Text: ="Nr. " & ThisItem.ID
                        Width: =80
                        X: =10
                        Y: =10
                  - lblArtikel_M:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkGray
                        Height: =20
                        Text: =ThisItem.Artikelnummer & " · " & ThisItem.Stueckzahl & " Stk."
                        Width: =300
                        X: =100
                        Y: =10
                  - lblWert_M:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.MidGray
                        Height: =20
                        Size: =10
                        Text: =Text(ThisItem.Wert, "#,##0.00") & " €"
                        Width: =150
                        X: =100
                        Y: =36
                  - lblStatus_M:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =AppTheme.White
                        Fill: |-
                          =Switch(
                              ThisItem.Status.Value,
                              "Erledigt", AppTheme.DarkGreen,
                              "Abgelehnt", AppTheme.LightRed,
                              AppTheme.DarkYellow
                          )
                        Height: =22
                        Size: =10
                        Text: =ThisItem.Status.Value
                        Width: =130
                        X: =260
                        Y: =36
                  - btnOeffnen_M:
                      Control: ModernButton@1.0.0
                      Properties:
                        BasePaletteColor: =AppTheme.LightBlue
                        Height: =30
                        OnSelect: |-
                          =Set(varAntrag, ThisItem);
                          Navigate(scrDetail, ScreenTransition.Fade)
                        Text: ="Öffnen"
                        Width: =90
                        X: =510
                        Y: =20
            - btnNavAntrag_M:
                Control: ModernButton@1.0.0
                Properties:
                  BasePaletteColor: =AppTheme.LightBlue
                  Height: =35
                  OnSelect: =Navigate(scrAntrag, ScreenTransition.Fade)
                  Text: ="Neuer Antrag"
                  Width: =250
                  X: =10
                  Y: =30
            - btnNavMeine_M:
                Control: ModernButton@1.0.0
                Properties:
                  BasePaletteColor: =AppTheme.DarkBlue
                  Height: =35
                  OnSelect: =Navigate(scrMeineAntraege, ScreenTransition.Fade)
                  Text: ="Meine Anträge"
                  Width: =250
                  X: =10
                  Y: =70
            - btnNavFreigaben_M:
                Control: ModernButton@1.0.0
                Properties:
                  BasePaletteColor: =AppTheme.LightBlue
                  Height: =35
                  OnSelect: =Navigate(scrFreigaben, ScreenTransition.Fade)
                  Text: ="Freigaben"
                  Width: =250
                  X: =10
                  Y: =110
  scrFreigaben:
    Properties:
      Fill: =AppTheme.NearWhite
      LoadingSpinnerColor: =AppTheme.DarkBlue
      OnVisible: |
        =Set(varIstGF, !IsBlank(LookUp(Rollen, Rolle.Value = "GF" && Person.Email = User().Email)));
        Set(varIstMaWi, !IsBlank(LookUp(Rollen, Rolle.Value = "MaWi" && Person.Email = User().Email)));
        ClearCollect(colAufgaben, Filter(Antraege, Status.Value = "Wartet auf FK", Vorgesetzter.Email = User().Email));
        If(varIstGF, Collect(colAufgaben, Filter(Antraege, Status.Value = "Wartet auf GF")));
        If(varIstMaWi, Collect(colAufgaben, Filter(Antraege, Status.Value = "Bei MaWi")))
    Children:
      - Container_Header_F:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =AppTheme.OffWhite
            Height: =32
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingLeft: =12
            PaddingRight: =12
            Width: =Parent.Width
          Children:
            - Label_AppTitle_F:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =AppTheme.DarkGray
                  Size: =11
                  Text: ="Freigaben"
                  Width: =Parent.Width
      - Container_Content_F:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =AppTheme.NearWhite
            Height: =Parent.Height - Container_Header_F.Height
            Width: =Parent.Width
            Y: =32
          Children:
            - lblFreigabenHeading:
                Control: Label@2.5.1
                Properties:
                  Color: =AppTheme.DarkBlue
                  FontWeight: =FontWeight.Bold
                  Height: =30
                  Size: =18
                  Text: ="Offene Freigaben (" & CountRows(colAufgaben) & ")"
                  Width: =400
                  X: =(Parent.Width - 620) / 2
                  Y: =20
            - galAufgaben:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  BorderColor: =AppTheme.PaleGray
                  BorderThickness: =1
                  Fill: =AppTheme.White
                  Height: =Parent.Height - Self.Y - 20
                  Items: =Sort(colAufgaben, ID, SortOrder.Descending)
                  TemplateSize: =70
                  Width: =620
                  X: =(Parent.Width - 620) / 2
                  Y: =60
                Children:
                  - lblNr_F:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkGray
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        Text: ="Nr. " & ThisItem.ID
                        Width: =80
                        X: =10
                        Y: =10
                  - lblAntragsteller_F:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkGray
                        Height: =20
                        Text: =ThisItem.Antragsteller.DisplayName
                        Width: =200
                        X: =100
                        Y: =10
                  - lblArtikel_F:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.MidGray
                        Height: =20
                        Size: =10
                        Text: =ThisItem.Artikelnummer & " · " & ThisItem.Stueckzahl & " Stk. · " & Text(ThisItem.Wert, "#,##0.00") & " €"
                        Width: =260
                        X: =100
                        Y: =36
                  - lblStatus_F:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =AppTheme.White
                        Fill: =AppTheme.DarkYellow
                        Height: =22
                        Size: =10
                        Text: =ThisItem.Status.Value
                        Width: =130
                        X: =370
                        Y: =24
                  - btnOeffnen_F:
                      Control: ModernButton@1.0.0
                      Properties:
                        BasePaletteColor: =AppTheme.DarkBlue
                        Height: =30
                        OnSelect: |-
                          =Set(varAntrag, ThisItem);
                          Navigate(scrDetail, ScreenTransition.Fade)
                        Text: ="Prüfen"
                        Width: =90
                        X: =510
                        Y: =20
            - btnNavAntrag_F:
                Control: ModernButton@1.0.0
                Properties:
                  BasePaletteColor: =AppTheme.LightBlue
                  Height: =35
                  OnSelect: =Navigate(scrAntrag, ScreenTransition.Fade)
                  Text: ="Neuer Antrag"
                  Width: =250
                  X: =10
                  Y: =30
            - btnNavMeine_F:
                Control: ModernButton@1.0.0
                Properties:
                  BasePaletteColor: =AppTheme.LightBlue
                  Height: =35
                  OnSelect: =Navigate(scrMeineAntraege, ScreenTransition.Fade)
                  Text: ="Meine Anträge"
                  Width: =250
                  X: =10
                  Y: =70
            - btnNavFreigaben_F:
                Control: ModernButton@1.0.0
                Properties:
                  BasePaletteColor: =AppTheme.DarkBlue
                  Height: =35
                  OnSelect: =Navigate(scrFreigaben, ScreenTransition.Fade)
                  Text: ="Freigaben"
                  Width: =250
                  X: =10
                  Y: =110
  scrDetail:
    Properties:
      Fill: =AppTheme.NearWhite
      LoadingSpinnerColor: =AppTheme.DarkBlue
      OnVisible: |
        =Set(varAntrag, LookUp(Antraege, ID = varAntrag.ID));
        Set(varIstGF, !IsBlank(LookUp(Rollen, Rolle.Value = "GF" && Person.Email = User().Email)));
        Set(varIstMaWi, !IsBlank(LookUp(Rollen, Rolle.Value = "MaWi" && Person.Email = User().Email)));
        Set(varDarfFK, varAntrag.Status.Value = "Wartet auf FK" && varAntrag.Vorgesetzter.Email = User().Email);
        Set(varDarfGF, varAntrag.Status.Value = "Wartet auf GF" && varIstGF);
        Set(varDarfMaWi, varAntrag.Status.Value = "Bei MaWi" && varIstMaWi);
        Set(varKommentarOffen, false);
        Set(varEditKommentarID, 0);
        Reset(txtEntscheidung)
    Children:
      - Container_Header_D:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =AppTheme.OffWhite
            Height: =32
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingLeft: =12
            PaddingRight: =12
            Width: =Parent.Width
          Children:
            - Label_AppTitle_D:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =AppTheme.DarkGray
                  Size: =11
                  Text: ="Antrag"
                  Width: =Parent.Width
      - Container_Content_D:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =AppTheme.NearWhite
            Height: =Parent.Height - Container_Header_D.Height
            Width: =Parent.Width
            Y: =32
          Children:
            - Card_Details:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =AppTheme.PaleGray
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =AppTheme.White
                  Height: =300
                  Width: =520
                  X: =Max(280, (Parent.Width - 1060) / 2)
                  Y: =20
                Children:
                  - lblDetailHeading:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkBlue
                        FontWeight: =FontWeight.Bold
                        Height: =30
                        Size: =18
                        Text: ="Antrag Nr. " & varAntrag.ID
                        Width: =320
                        X: =20
                        Y: =16
                  - lblDetailStatus:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =AppTheme.White
                        Fill: |-
                          =Switch(
                              varAntrag.Status.Value,
                              "Erledigt", AppTheme.DarkGreen,
                              "Abgelehnt", AppTheme.LightRed,
                              AppTheme.DarkYellow
                          )
                        Height: =26
                        Size: =10
                        Text: =varAntrag.Status.Value
                        Width: =140
                        X: =360
                        Y: =18
                  - lblDetailDaten:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkGray
                        Height: =220
                        Text: |-
                          ="Antragsteller:  " & varAntrag.Antragsteller.DisplayName & Char(10) &
                          "Vorgesetzter:  " & varAntrag.Vorgesetzter.DisplayName & Char(10) &
                          "Fachbereich:  " & varAntrag.Fachbereich.Value & Char(10) &
                          "Artikelnummer:  " & varAntrag.Artikelnummer & Char(10) &
                          "Stückzahl:  " & varAntrag.Stueckzahl & Char(10) &
                          "Wert:  " & Text(varAntrag.Wert, "#,##0.00") & " €" & Char(10) &
                          "Kostenstelle:  " & varAntrag.Kostenstelle & Char(10) &
                          "Wo liegt die Ware:  " & varAntrag.Lagerort & Char(10) &
                          "Erstellt:  " & Text(varAntrag.Erstellt, "dd.mm.yyyy hh:mm")
                        VerticalAlign: =VerticalAlign.Top
                        Width: =480
                        X: =20
                        Y: =60
            - Card_Dateien:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =AppTheme.PaleGray
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =AppTheme.White
                  Height: =Max(120, Parent.Height - Self.Y - 10)
                  Width: =520
                  X: =Max(280, (Parent.Width - 1060) / 2)
                  Y: =335
                Children:
                  - lblDateienTitel:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.MidGray
                        Height: =20
                        Size: =10
                        Text: ="DATEIEN"
                        Width: =300
                        X: =20
                        Y: =10
                  - galDateien:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        Height: =Parent.Height - Self.Y - 5
                        Items: =varAntrag.Attachments
                        TemplateSize: =36
                        Width: =490
                        X: =15
                        Y: =34
                      Children:
                        - lblDateiName:
                            Control: Label@2.5.1
                            Properties:
                              Color: =AppTheme.DarkGray
                              Height: =28
                              Text: =ThisItem.DisplayName
                              Width: =360
                              X: =5
                              Y: =4
                        - btnDateiOeffnen:
                            Control: ModernButton@1.0.0
                            Properties:
                              BasePaletteColor: =AppTheme.LightBlue
                              Height: =28
                              OnSelect: =Launch(ThisItem.AbsoluteUri)
                              Text: ="Öffnen"
                              Width: =90
                              X: =375
                              Y: =4
            - Card_Aktion:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =AppTheme.PaleGray
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =AppTheme.White
                  Height: =200
                  Visible: =varDarfFK || varDarfGF || varDarfMaWi
                  Width: =520
                  X: =Max(280, (Parent.Width - 1060) / 2) + 540
                  Y: =20
                Children:
                  - lblAktionTitel:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkBlue
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        Size: =14
                        Text: =If(varDarfFK, "Freigabe Vorgesetzter", varDarfGF, "Freigabe Geschäftsführung", "Bearbeitung MaWi")
                        Width: =480
                        X: =20
                        Y: =12
                  - txtEntscheidung:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        Fill: =AppTheme.OffWhite
                        Height: =60
                        Placeholder: ="Kommentar (bei Ablehnung Pflicht)"
                        Type: =TextInputType.Multiline
                        Width: =480
                        X: =20
                        Y: =50
                  - btnFreigeben:
                      Control: ModernButton@1.0.0
                      Properties:
                        BasePaletteColor: =AppTheme.DarkGreen
                        Height: =35
                        OnSelect: |-
                          =Set(
                              varAntrag,
                              Patch(
                                  Antraege,
                                  varAntrag,
                                  {
                                      Status: {
                                          Value: If(varDarfFK && varAntrag.Wert > 5000, "Wartet auf GF", "Bei MaWi")
                                      }
                                  }
                              )
                          );
                          Patch(
                              Kommentare,
                              Defaults(Kommentare),
                              {
                                  RückfrageTyp: {Value: "Freigabe"},
                                  RückfrageText: Coalesce(Trim(txtEntscheidung.Text), "Freigegeben"),
                                  Person: {
                                      Claims: "i:0#.f|membership|" & User().Email,
                                      Department: "",
                                      DisplayName: User().FullName,
                                      Email: User().Email,
                                      JobTitle: "",
                                      Picture: ""
                                  },
                                  AnforderungsID: {
                                      Id: varAntrag.ID,
                                      Value: varAntrag.Titel
                                  }
                              }
                          );
                          Notify("Antrag freigegeben.", NotificationType.Success);
                          Navigate(scrFreigaben, ScreenTransition.Fade)
                        Text: ="Freigeben"
                        Visible: =varDarfFK || varDarfGF
                        Width: =150
                        X: =20
                        Y: =140
                  - btnAblehnen:
                      Control: ModernButton@1.0.0
                      Properties:
                        BasePaletteColor: =AppTheme.LightRed
                        DisplayMode: =If(IsBlank(Trim(txtEntscheidung.Text)), DisplayMode.Disabled, DisplayMode.Edit)
                        Height: =35
                        OnSelect: |-
                          =Set(
                              varAntrag,
                              Patch(Antraege, varAntrag, {Status: {Value: "Abgelehnt"}})
                          );
                          Patch(
                              Kommentare,
                              Defaults(Kommentare),
                              {
                                  RückfrageTyp: {Value: "Ablehnung"},
                                  RückfrageText: txtEntscheidung.Text,
                                  Person: {
                                      Claims: "i:0#.f|membership|" & User().Email,
                                      Department: "",
                                      DisplayName: User().FullName,
                                      Email: User().Email,
                                      JobTitle: "",
                                      Picture: ""
                                  },
                                  AnforderungsID: {
                                      Id: varAntrag.ID,
                                      Value: varAntrag.Titel
                                  }
                              }
                          );
                          Notify("Antrag abgelehnt.", NotificationType.Warning);
                          Navigate(scrFreigaben, ScreenTransition.Fade)
                        Text: ="Ablehnen"
                        Visible: =varDarfFK || varDarfGF
                        Width: =150
                        X: =185
                        Y: =140
                  - btnErledigt:
                      Control: ModernButton@1.0.0
                      Properties:
                        BasePaletteColor: =AppTheme.DarkGreen
                        Height: =35
                        OnSelect: |-
                          =Set(
                              varAntrag,
                              Patch(Antraege, varAntrag, {Status: {Value: "Erledigt"}})
                          );
                          Patch(
                              Kommentare,
                              Defaults(Kommentare),
                              {
                                  RückfrageTyp: {Value: "Erledigt"},
                                  RückfrageText: Coalesce(Trim(txtEntscheidung.Text), "Erledigt"),
                                  Person: {
                                      Claims: "i:0#.f|membership|" & User().Email,
                                      Department: "",
                                      DisplayName: User().FullName,
                                      Email: User().Email,
                                      JobTitle: "",
                                      Picture: ""
                                  },
                                  AnforderungsID: {
                                      Id: varAntrag.ID,
                                      Value: varAntrag.Titel
                                  }
                              }
                          );
                          Notify("Antrag erledigt.", NotificationType.Success);
                          Navigate(scrFreigaben, ScreenTransition.Fade)
                        Text: ="Erledigt"
                        Visible: =varDarfMaWi
                        Width: =150
                        X: =20
                        Y: =140
            - Container_Kommentar:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =AppTheme.DarkBlue
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =AppTheme.White
                  Height: =Max(200, Parent.Height - Self.Y - 10)
                  Width: =520
                  X: =Max(280, (Parent.Width - 1060) / 2) + 540
                  Y: =If(Card_Aktion.Visible, 235, 20)
                Children:
                  - Label_LeerHinweis:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =AppTheme.DarkGray
                        Fill: =AppTheme.White
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.Height
                        Size: =10
                        Text: ="Keine Kommentare vorhanden"
                        Visible: |-
                          =!varKommentarOffen && CountRows(
                              Filter(
                                  Kommentare,
                                  AnforderungsID.Id = varAntrag.ID
                              )
                          ) = 0
                        Width: =Parent.Width
                  - Button_Kommentar_Hinzufuegen:
                      Control: ModernButton@1.0.0
                      Properties:
                        BasePaletteColor: =AppTheme.DarkBlue
                        Height: =25
                        Icon: =If(varKommentarOffen, Icon.Cancel, Icon.Add)
                        OnSelect: =Set(varKommentarOffen, !varKommentarOffen)
                        Text: =""
                        Width: =25
                        X: =Parent.Width - 30
                        Y: =Parent.Height - 28
                  - TextInput_Kommentar_Neu:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        Fill: =AppTheme.NearWhite
                        Height: =53
                        Placeholder: ="Kommentar eingeben..."
                        Type: =TextInputType.Multiline
                        Visible: =varKommentarOffen
                        Width: =Parent.Width - 110
                        X: =10
                        Y: =Parent.Height - 57
                  - Button_Kommentar_Neu_Senden:
                      Control: ModernButton@1.0.0
                      Properties:
                        BasePaletteColor: =AppTheme.DarkBlue
                        DisplayMode: |-
                          =If(
                              IsBlank(TextInput_Kommentar_Neu.Text),
                              DisplayMode.Disabled,
                              DisplayMode.Edit
                          )
                        Height: =25
                        Icon: =Icon.Check
                        OnSelect: |-
                          =Patch(
                              Kommentare,
                              Defaults(Kommentare),
                              {
                                  RückfrageTyp: {Value: "Info"},
                                  RückfrageText: TextInput_Kommentar_Neu.Text,
                                  Person: {
                                      Claims: "i:0#.f|membership|" & User().Email,
                                      Department: "",
                                      DisplayName: User().FullName,
                                      Email: User().Email,
                                      JobTitle: "",
                                      Picture: ""
                                  },
                                  AnforderungsID: {
                                      Id: varAntrag.ID,
                                      Value: varAntrag.Titel
                                  }
                              }
                          );
                          Reset(TextInput_Kommentar_Neu);
                          Set(varKommentarOffen, false)
                        Text: =""
                        Visible: =varKommentarOffen
                        Width: =25
                        X: =Parent.Width - 30
                        Y: =Parent.Height - 57
                  - Gallery_Kommentare:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        BorderColor: =AppTheme.DarkBlue
                        Fill: =AppTheme.White
                        Height: =If(varKommentarOffen, Parent.Height - 85, Parent.Height - 35)
                        Items: |-
                          =Filter(
                              Kommentare,
                              AnforderungsID.Id = varAntrag.ID
                          )
                        TemplateSize: =55
                        Visible: |-
                          =CountRows(
                              Filter(
                                  Kommentare,
                                  AnforderungsID.Id = varAntrag.ID
                              )
                          ) <> 0
                        Width: =Parent.Width - 5
                        X: =5
                      Children:
                        - Button_Kommentar_Loeschen:
                            Control: ModernButton@1.0.0
                            Properties:
                              BasePaletteColor: =AppTheme.LightRed
                              Height: =25
                              Icon: =Icon.Trash
                              OnSelect: =Remove(Kommentare, ThisItem)
                              Text: =""
                              Visible: =ThisItem.Person.Email = User().Email && ThisItem.RückfrageTyp.Value = "Info"
                              Width: =25
                              X: =Parent.TemplateWidth - 40
                              Y: =15
                        - Button_Kommentar_Speichern:
                            Control: ModernButton@1.0.0
                            Properties:
                              BasePaletteColor: =AppTheme.DarkBlue
                              DisplayMode: |-
                                =If(
                                    varEditKommentarID = ThisItem.ID
                                    && TextInput_Kommentar_Edit.Text <> ThisItem.RückfrageText,
                                    DisplayMode.Edit,
                                    DisplayMode.Disabled
                                )
                              Height: =25
                              Icon: =Icon.Save
                              OnSelect: |-
                                =Patch(
                                    Kommentare,
                                    ThisItem,
                                    {
                                        RückfrageText: TextInput_Kommentar_Edit.Text
                                    }
                                );
                                Set(varEditKommentarID, 0)
                              Text: =""
                              Visible: =ThisItem.Person.Email = User().Email && ThisItem.RückfrageTyp.Value = "Info"
                              Width: =25
                              X: =Parent.TemplateWidth - 70
                              Y: =15
                        - Button_Kommentar_Edit_Toggle:
                            Control: ModernButton@1.0.0
                            Properties:
                              BasePaletteColor: |-
                                =If(
                                    varEditKommentarID = ThisItem.ID,
                                    AppTheme.LightBlue,
                                    AppTheme.DarkBlue
                                )
                              Height: =25
                              Icon: =If(varEditKommentarID = ThisItem.ID, Icon.Cancel, Icon.Edit)
                              OnSelect: |-
                                =If(
                                    varEditKommentarID = ThisItem.ID,
                                    Set(varEditKommentarID, 0),
                                    Set(varEditKommentarID, ThisItem.ID)
                                )
                              Text: =""
                              Visible: =ThisItem.Person.Email = User().Email && ThisItem.RückfrageTyp.Value = "Info"
                              Width: =25
                              X: =Parent.TemplateWidth - 100
                              Y: =15
                        - TextInput_Kommentar_Edit:
                            Control: ModernTextInput@1.1.2
                            Properties:
                              Default: =ThisItem.RückfrageText
                              DisplayMode: |-
                                =If(
                                    varEditKommentarID = ThisItem.ID,
                                    DisplayMode.Edit,
                                    DisplayMode.View
                                )
                              Fill: =AppTheme.White
                              Height: =38
                              Placeholder: ="Kommentar bearbeiten"
                              Type: =TextInputType.Multiline
                              Width: =Parent.TemplateWidth - 110
                              X: =Label_Kommentar_Person.X
                              Y: =16
                        - Label_Kommentar_Person:
                            Control: Label@2.5.1
                            Properties:
                              Color: =AppTheme.DarkGray
                              Fill: =AppTheme.White
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =15
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingTop: =0
                              Size: =9
                              Text: =ThisItem.Person.DisplayName & " | " & ThisItem.Erstellt & " | " & ThisItem.RückfrageTyp.Value
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.TemplateWidth - 110
                              X: =1
            - btnNavAntrag_D:
                Control: ModernButton@1.0.0
                Properties:
                  BasePaletteColor: =AppTheme.LightBlue
                  Height: =35
                  OnSelect: =Navigate(scrAntrag, ScreenTransition.Fade)
                  Text: ="Neuer Antrag"
                  Width: =250
                  X: =10
                  Y: =30
            - btnNavMeine_D:
                Control: ModernButton@1.0.0
                Properties:
                  BasePaletteColor: =AppTheme.LightBlue
                  Height: =35
                  OnSelect: =Navigate(scrMeineAntraege, ScreenTransition.Fade)
                  Text: ="Meine Anträge"
                  Width: =250
                  X: =10
                  Y: =70
            - btnNavFreigaben_D:
                Control: ModernButton@1.0.0
                Properties:
                  BasePaletteColor: =AppTheme.LightBlue
                  Height: =35
                  OnSelect: =Navigate(scrFreigaben, ScreenTransition.Fade)
                  Text: ="Freigaben"
                  Width: =250
                  X: =10
                  Y: =110
            - btnZurueck_D:
                Control: ModernButton@1.0.0
                Properties:
                  BasePaletteColor: =AppTheme.MidGray
                  Height: =35
                  OnSelect: =Back()
                  Text: ="Zurück"
                  Width: =250
                  X: =10
                  Y: =170
