Screens:
  scrFreigaben:
    Properties:
      Fill: =AppTheme.NearWhite
      LoadingSpinnerColor: =AppTheme.DarkBlue
      OnVisible: |
        =Set(varIstGF, !IsBlank(LookUp(Rollen, Rolle.Value = "GF" && Person.Email = User().Email)));
        Set(varIstMaWi, !IsBlank(LookUp(Rollen, Rolle.Value = "MaWi" && Person.Email = User().Email)));
        ClearCollect(colAufgaben, Filter(Antraege, Status.Value = "Wartet auf FK", Vorgesetzter.Email = User().Email));
        If(varIstGF, Collect(colAufgaben, Filter(Antraege, Status.Value = "Wartet auf GF")));
        If(varIstMaWi, Collect(colAufgaben, Filter(Antraege, Status.Value = "Bei MaWi")))
    Children:
      - Container_Header_F:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =AppTheme.OffWhite
            Height: =32
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingLeft: =12
            PaddingRight: =12
            Width: =Parent.Width
          Children:
            - Label_AppTitle_F:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =AppTheme.DarkGray
                  Size: =11
                  Text: ="Freigaben"
                  Width: =Parent.Width
      - Container_Content_F:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =AppTheme.NearWhite
            Height: =Parent.Height - Container_Header_F.Height
            Width: =Parent.Width
            Y: =32
          Children:
            - lblFreigabenHeading:
                Control: Label@2.5.1
                Properties:
                  Color: =AppTheme.DarkBlue
                  FontWeight: =FontWeight.Bold
                  Height: =30
                  Size: =18
                  Text: ="Offene Freigaben (" & CountRows(colAufgaben) & ")"
                  Width: =400
                  X: =(Parent.Width - 620) / 2
                  Y: =20
            - galAufgaben:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  BorderColor: =AppTheme.PaleGray
                  BorderThickness: =1
                  Fill: =AppTheme.White
                  Height: =Parent.Height - Self.Y - 20
                  Items: =Sort(colAufgaben, ID, SortOrder.Descending)
                  TemplateSize: =70
                  Width: =620
                  X: =(Parent.Width - 620) / 2
                  Y: =60
                Children:
                  - lblNr_F:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkGray
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        Text: ="Nr. " & ThisItem.ID
                        Width: =80
                        X: =10
                        Y: =10
                  - lblAntragsteller_F:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkGray
                        Height: =20
                        Text: =ThisItem.Antragsteller.DisplayName
                        Width: =200
                        X: =100
                        Y: =10
                  - lblArtikel_F:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.MidGray
                        Height: =20
                        Size: =10
                        Text: =ThisItem.Artikelnummer & " · " & ThisItem.Stueckzahl & " Stk. · " & Text(ThisItem.Wert, "#,##0.00") & " €"
                        Width: =260
                        X: =100
                        Y: =36
                  - lblStatus_F:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =AppTheme.White
                        Fill: =AppTheme.DarkYellow
                        Height: =22
                        Size: =10
                        Text: =ThisItem.Status.Value
                        Width: =130
                        X: =370
                        Y: =24
                  - btnOeffnen_F:
                      Control: ModernButton@1.0.0
                      Properties:
                        BasePaletteColor: =AppTheme.DarkBlue
                        Height: =30
                        OnSelect: |-
                          =Set(varAntrag, ThisItem);
                          Navigate(scrDetail, ScreenTransition.Fade)
                        Text: ="Prüfen"
                        Width: =90
                        X: =510
                        Y: =20
            - btnNavAntrag_F:
                Control: ModernButton@1.0.0
                Properties:
                  BasePaletteColor: =AppTheme.LightBlue
                  Height: =35
                  OnSelect: =Navigate(scrAntrag, ScreenTransition.Fade)
                  Text: ="Neuer Antrag"
                  Width: =250
                  X: =10
                  Y: =30
            - btnNavMeine_F:
                Control: ModernButton@1.0.0
                Properties:
                  BasePaletteColor: =AppTheme.LightBlue
                  Height: =35
                  OnSelect: =Navigate(scrMeineAntraege, ScreenTransition.Fade)
                  Text: ="Meine Anträge"
                  Width: =250
                  X: =10
                  Y: =70
            - btnNavFreigaben_F:
                Control: ModernButton@1.0.0
                Properties:
                  BasePaletteColor: =AppTheme.DarkBlue
                  Height: =35
                  OnSelect: =Navigate(scrFreigaben, ScreenTransition.Fade)
                  Text: ="Freigaben"
                  Width: =250
                  X: =10
                  Y: =110
