Screens:
  scrDetail:
    Properties:
      Fill: =AppTheme.NearWhite
      LoadingSpinnerColor: =AppTheme.DarkBlue
      OnVisible: |
        =Set(varAntrag, LookUp(Antraege, ID = varAntrag.ID));
        Set(varIstGF, !IsBlank(LookUp(Rollen, Rolle.Value = "GF" && Person.Email = User().Email)));
        Set(varIstMaWi, !IsBlank(LookUp(Rollen, Rolle.Value = "MaWi" && Person.Email = User().Email)));
        Set(varDarfFK, varAntrag.Status.Value = "Wartet auf FK" && varAntrag.Vorgesetzter.Email = User().Email);
        Set(varDarfGF, varAntrag.Status.Value = "Wartet auf GF" && varIstGF);
        Set(varDarfMaWi, varAntrag.Status.Value = "Bei MaWi" && varIstMaWi);
        Set(varKommentarOffen, false);
        Set(varEditKommentarID, 0);
        Reset(txtEntscheidung)
    Children:
      - Container_Header_D:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =AppTheme.OffWhite
            Height: =32
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingLeft: =12
            PaddingRight: =12
            Width: =Parent.Width
          Children:
            - Label_AppTitle_D:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =AppTheme.DarkGray
                  Size: =11
                  Text: ="Antrag"
                  Width: =Parent.Width
      - Container_Content_D:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =AppTheme.NearWhite
            Height: =Parent.Height - Container_Header_D.Height
            Width: =Parent.Width
            Y: =32
          Children:
            - Card_Details:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =AppTheme.PaleGray
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =AppTheme.White
                  Height: =300
                  Width: =520
                  X: =Max(280, (Parent.Width - 1060) / 2)
                  Y: =20
                Children:
                  - lblDetailHeading:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkBlue
                        FontWeight: =FontWeight.Bold
                        Height: =30
                        Size: =18
                        Text: ="Antrag Nr. " & varAntrag.ID
                        Width: =320
                        X: =20
                        Y: =16
                  - lblDetailStatus:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =AppTheme.White
                        Fill: |-
                          =Switch(
                              varAntrag.Status.Value,
                              "Erledigt", AppTheme.DarkGreen,
                              "Abgelehnt", AppTheme.LightRed,
                              AppTheme.DarkYellow
                          )
                        Height: =26
                        Size: =10
                        Text: =varAntrag.Status.Value
                        Width: =140
                        X: =360
                        Y: =18
                  - lblDetailDaten:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkGray
                        Height: =220
                        Text: |-
                          ="Antragsteller:  " & varAntrag.Antragsteller.DisplayName & Char(10) &
                          "Vorgesetzter:  " & varAntrag.Vorgesetzter.DisplayName & Char(10) &
                          "Fachbereich:  " & varAntrag.Fachbereich.Value & Char(10) &
                          "Artikelnummer:  " & varAntrag.Artikelnummer & Char(10) &
                          "Stückzahl:  " & varAntrag.Stueckzahl & Char(10) &
                          "Wert:  " & Text(varAntrag.Wert, "#,##0.00") & " €" & Char(10) &
                          "Kostenstelle:  " & varAntrag.Kostenstelle & Char(10) &
                          "Wo liegt die Ware:  " & varAntrag.Lagerort & Char(10) &
                          "Erstellt:  " & Text(varAntrag.Erstellt, "dd.mm.yyyy hh:mm")
                        VerticalAlign: =VerticalAlign.Top
                        Width: =480
                        X: =20
                        Y: =60
            - Card_Dateien:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =AppTheme.PaleGray
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =AppTheme.White
                  Height: =Max(120, Parent.Height - Self.Y - 10)
                  Width: =520
                  X: =Max(280, (Parent.Width - 1060) / 2)
                  Y: =335
                Children:
                  - lblDateienTitel:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.MidGray
                        Height: =20
                        Size: =10
                        Text: ="DATEIEN"
                        Width: =300
                        X: =20
                        Y: =10
                  - galDateien:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        Height: =Parent.Height - Self.Y - 5
                        Items: =varAntrag.Attachments
                        TemplateSize: =36
                        Width: =490
                        X: =15
                        Y: =34
                      Children:
                        - lblDateiName:
                            Control: Label@2.5.1
                            Properties:
                              Color: =AppTheme.DarkGray
                              Height: =28
                              Text: =ThisItem.DisplayName
                              Width: =360
                              X: =5
                              Y: =4
                        - btnDateiOeffnen:
                            Control: ModernButton@1.0.0
                            Properties:
                              BasePaletteColor: =AppTheme.LightBlue
                              Height: =28
                              OnSelect: =Launch(ThisItem.AbsoluteUri)
                              Text: ="Öffnen"
                              Width: =90
                              X: =375
                              Y: =4
            - Card_Aktion:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =AppTheme.PaleGray
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =AppTheme.White
                  Height: =200
                  Visible: =varDarfFK || varDarfGF || varDarfMaWi
                  Width: =520
                  X: =Max(280, (Parent.Width - 1060) / 2) + 540
                  Y: =20
                Children:
                  - lblAktionTitel:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkBlue
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        Size: =14
                        Text: =If(varDarfFK, "Freigabe Vorgesetzter", varDarfGF, "Freigabe Geschäftsführung", "Bearbeitung MaWi")
                        Width: =480
                        X: =20
                        Y: =12
                  - txtEntscheidung:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        Fill: =AppTheme.OffWhite
                        Height: =60
                        Placeholder: ="Kommentar (bei Ablehnung Pflicht)"
                        Type: =TextInputType.Multiline
                        Width: =480
                        X: =20
                        Y: =50
                  - btnFreigeben:
                      Control: ModernButton@1.0.0
                      Properties:
                        BasePaletteColor: =AppTheme.DarkGreen
                        Height: =35
                        OnSelect: |-
                          =Set(
                              varAntrag,
                              Patch(
                                  Antraege,
                                  varAntrag,
                                  {
                                      Status: {
                                          Value: If(varDarfFK && varAntrag.Wert > 5000, "Wartet auf GF", "Bei MaWi")
                                      }
                                  }
                              )
                          );
                          Patch(
                              Kommentare,
                              Defaults(Kommentare),
                              {
                                  RückfrageTyp: {Value: "Freigabe"},
                                  RückfrageText: Coalesce(Trim(txtEntscheidung.Text), "Freigegeben"),
                                  Person: {
                                      Claims: "i:0#.f|membership|" & User().Email,
                                      Department: "",
                                      DisplayName: User().FullName,
                                      Email: User().Email,
                                      JobTitle: "",
                                      Picture: ""
                                  },
                                  AnforderungsID: {
                                      Id: varAntrag.ID,
                                      Value: varAntrag.Titel
                                  }
                              }
                          );
                          Notify("Antrag freigegeben.", NotificationType.Success);
                          Navigate(scrFreigaben, ScreenTransition.Fade)
                        Text: ="Freigeben"
                        Visible: =varDarfFK || varDarfGF
                        Width: =150
                        X: =20
                        Y: =140
                  - btnAblehnen:
                      Control: ModernButton@1.0.0
                      Properties:
                        BasePaletteColor: =AppTheme.LightRed
                        DisplayMode: =If(IsBlank(Trim(txtEntscheidung.Text)), DisplayMode.Disabled, DisplayMode.Edit)
                        Height: =35
                        OnSelect: |-
                          =Set(
                              varAntrag,
                              Patch(Antraege, varAntrag, {Status: {Value: "Abgelehnt"}})
                          );
                          Patch(
                              Kommentare,
                              Defaults(Kommentare),
                              {
                                  RückfrageTyp: {Value: "Ablehnung"},
                                  RückfrageText: txtEntscheidung.Text,
                                  Person: {
                                      Claims: "i:0#.f|membership|" & User().Email,
                                      Department: "",
                                      DisplayName: User().FullName,
                                      Email: User().Email,
                                      JobTitle: "",
                                      Picture: ""
                                  },
                                  AnforderungsID: {
                                      Id: varAntrag.ID,
                                      Value: varAntrag.Titel
                                  }
                              }
                          );
                          Notify("Antrag abgelehnt.", NotificationType.Warning);
                          Navigate(scrFreigaben, ScreenTransition.Fade)
                        Text: ="Ablehnen"
                        Visible: =varDarfFK || varDarfGF
                        Width: =150
                        X: =185
                        Y: =140
                  - btnErledigt:
                      Control: ModernButton@1.0.0
                      Properties:
                        BasePaletteColor: =AppTheme.DarkGreen
                        Height: =35
                        OnSelect: |-
                          =Set(
                              varAntrag,
                              Patch(Antraege, varAntrag, {Status: {Value: "Erledigt"}})
                          );
                          Patch(
                              Kommentare,
                              Defaults(Kommentare),
                              {
                                  RückfrageTyp: {Value: "Erledigt"},
                                  RückfrageText: Coalesce(Trim(txtEntscheidung.Text), "Erledigt"),
                                  Person: {
                                      Claims: "i:0#.f|membership|" & User().Email,
                                      Department: "",
                                      DisplayName: User().FullName,
                                      Email: User().Email,
                                      JobTitle: "",
                                      Picture: ""
                                  },
                                  AnforderungsID: {
                                      Id: varAntrag.ID,
                                      Value: varAntrag.Titel
                                  }
                              }
                          );
                          Notify("Antrag erledigt.", NotificationType.Success);
                          Navigate(scrFreigaben, ScreenTransition.Fade)
                        Text: ="Erledigt"
                        Visible: =varDarfMaWi
                        Width: =150
                        X: =20
                        Y: =140
            - Container_Kommentar:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =AppTheme.DarkBlue
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =AppTheme.White
                  Height: =Max(200, Parent.Height - Self.Y - 10)
                  Width: =520
                  X: =Max(280, (Parent.Width - 1060) / 2) + 540
                  Y: =If(Card_Aktion.Visible, 235, 20)
                Children:
                  - Label_LeerHinweis:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =AppTheme.DarkGray
                        Fill: =AppTheme.White
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.Height
                        Size: =10
                        Text: ="Keine Kommentare vorhanden"
                        Visible: |-
                          =!varKommentarOffen && CountRows(
                              Filter(
                                  Kommentare,
                                  AnforderungsID.Id = varAntrag.ID
                              )
                          ) = 0
                        Width: =Parent.Width
                  - Button_Kommentar_Hinzufuegen:
                      Control: ModernButton@1.0.0
                      Properties:
                        BasePaletteColor: =AppTheme.DarkBlue
                        Height: =25
                        Icon: =If(varKommentarOffen, Icon.Cancel, Icon.Add)
                        OnSelect: =Set(varKommentarOffen, !varKommentarOffen)
                        Text: =""
                        Width: =25
                        X: =Parent.Width - 30
                        Y: =Parent.Height - 28
                  - TextInput_Kommentar_Neu:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        Fill: =AppTheme.NearWhite
                        Height: =53
                        Placeholder: ="Kommentar eingeben..."
                        Type: =TextInputType.Multiline
                        Visible: =varKommentarOffen
                        Width: =Parent.Width - 110
                        X: =10
                        Y: =Parent.Height - 57
                  - Button_Kommentar_Neu_Senden:
                      Control: ModernButton@1.0.0
                      Properties:
                        BasePaletteColor: =AppTheme.DarkBlue
                        DisplayMode: |-
                          =If(
                              IsBlank(TextInput_Kommentar_Neu.Text),
                              DisplayMode.Disabled,
                              DisplayMode.Edit
                          )
                        Height: =25
                        Icon: =Icon.Check
                        OnSelect: |-
                          =Patch(
                              Kommentare,
                              Defaults(Kommentare),
                              {
                                  RückfrageTyp: {Value: "Info"},
                                  RückfrageText: TextInput_Kommentar_Neu.Text,
                                  Person: {
                                      Claims: "i:0#.f|membership|" & User().Email,
                                      Department: "",
                                      DisplayName: User().FullName,
                                      Email: User().Email,
                                      JobTitle: "",
                                      Picture: ""
                                  },
                                  AnforderungsID: {
                                      Id: varAntrag.ID,
                                      Value: varAntrag.Titel
                                  }
                              }
                          );
                          Reset(TextInput_Kommentar_Neu);
                          Set(varKommentarOffen, false)
                        Text: =""
                        Visible: =varKommentarOffen
                        Width: =25
                        X: =Parent.Width - 30
                        Y: =Parent.Height - 57
                  - Gallery_Kommentare:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        BorderColor: =AppTheme.DarkBlue
                        Fill: =AppTheme.White
                        Height: =If(varKommentarOffen, Parent.Height - 85, Parent.Height - 35)
                        Items: |-
                          =Filter(
                              Kommentare,
                              AnforderungsID.Id = varAntrag.ID
                          )
                        TemplateSize: =55
                        Visible: |-
                          =CountRows(
                              Filter(
                                  Kommentare,
                                  AnforderungsID.Id = varAntrag.ID
                              )
                          ) <> 0
                        Width: =Parent.Width - 5
                        X: =5
                      Children:
                        - Button_Kommentar_Loeschen:
                            Control: ModernButton@1.0.0
                            Properties:
                              BasePaletteColor: =AppTheme.LightRed
                              Height: =25
                              Icon: =Icon.Trash
                              OnSelect: =Remove(Kommentare, ThisItem)
                              Text: =""
                              Visible: =ThisItem.Person.Email = User().Email && ThisItem.RückfrageTyp.Value = "Info"
                              Width: =25
                              X: =Parent.TemplateWidth - 40
                              Y: =15
                        - Button_Kommentar_Speichern:
                            Control: ModernButton@1.0.0
                            Properties:
                              BasePaletteColor: =AppTheme.DarkBlue
                              DisplayMode: |-
                                =If(
                                    varEditKommentarID = ThisItem.ID
                                    && TextInput_Kommentar_Edit.Text <> ThisItem.RückfrageText,
                                    DisplayMode.Edit,
                                    DisplayMode.Disabled
                                )
                              Height: =25
                              Icon: =Icon.Save
                              OnSelect: |-
                                =Patch(
                                    Kommentare,
                                    ThisItem,
                                    {
                                        RückfrageText: TextInput_Kommentar_Edit.Text
                                    }
                                );
                                Set(varEditKommentarID, 0)
                              Text: =""
                              Visible: =ThisItem.Person.Email = User().Email && ThisItem.RückfrageTyp.Value = "Info"
                              Width: =25
                              X: =Parent.TemplateWidth - 70
                              Y: =15
                        - Button_Kommentar_Edit_Toggle:
                            Control: ModernButton@1.0.0
                            Properties:
                              BasePaletteColor: |-
                                =If(
                                    varEditKommentarID = ThisItem.ID,
                                    AppTheme.LightBlue,
                                    AppTheme.DarkBlue
                                )
                              Height: =25
                              Icon: =If(varEditKommentarID = ThisItem.ID, Icon.Cancel, Icon.Edit)
                              OnSelect: |-
                                =If(
                                    varEditKommentarID = ThisItem.ID,
                                    Set(varEditKommentarID, 0),
                                    Set(varEditKommentarID, ThisItem.ID)
                                )
                              Text: =""
                              Visible: =ThisItem.Person.Email = User().Email && ThisItem.RückfrageTyp.Value = "Info"
                              Width: =25
                              X: =Parent.TemplateWidth - 100
                              Y: =15
                        - TextInput_Kommentar_Edit:
                            Control: ModernTextInput@1.1.2
                            Properties:
                              Default: =ThisItem.RückfrageText
                              DisplayMode: |-
                                =If(
                                    varEditKommentarID = ThisItem.ID,
                                    DisplayMode.Edit,
                                    DisplayMode.View
                                )
                              Fill: =AppTheme.White
                              Height: =38
                              Placeholder: ="Kommentar bearbeiten"
                              Type: =TextInputType.Multiline
                              Width: =Parent.TemplateWidth - 110
                              X: =Label_Kommentar_Person.X
                              Y: =16
                        - Label_Kommentar_Person:
                            Control: Label@2.5.1
                            Properties:
                              Color: =AppTheme.DarkGray
                              Fill: =AppTheme.White
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =15
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingTop: =0
                              Size: =9
                              Text: =ThisItem.Person.DisplayName & " | " & ThisItem.Erstellt & " | " & ThisItem.RückfrageTyp.Value
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.TemplateWidth - 110
                              X: =1
            - btnNavAntrag_D:
                Control: ModernButton@1.0.0
                Properties:
                  BasePaletteColor: =AppTheme.LightBlue
                  Height: =35
                  OnSelect: =Navigate(scrAntrag, ScreenTransition.Fade)
                  Text: ="Neuer Antrag"
                  Width: =250
                  X: =10
                  Y: =30
            - btnNavMeine_D:
                Control: ModernButton@1.0.0
                Properties:
                  BasePaletteColor: =AppTheme.LightBlue
                  Height: =35
                  OnSelect: =Navigate(scrMeineAntraege, ScreenTransition.Fade)
                  Text: ="Meine Anträge"
                  Width: =250
                  X: =10
                  Y: =70
            - btnNavFreigaben_D:
                Control: ModernButton@1.0.0
                Properties:
                  BasePaletteColor: =AppTheme.LightBlue
                  Height: =35
                  OnSelect: =Navigate(scrFreigaben, ScreenTransition.Fade)
                  Text: ="Freigaben"
                  Width: =250
                  X: =10
                  Y: =110
            - btnZurueck_D:
                Control: ModernButton@1.0.0
                Properties:
                  BasePaletteColor: =AppTheme.MidGray
                  Height: =35
                  OnSelect: =Back()
                  Text: ="Zurück"
                  Width: =250
                  X: =10
                  Y: =170
