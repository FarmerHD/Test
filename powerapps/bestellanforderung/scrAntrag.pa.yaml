Screens:
  scrAntrag:
    Properties:
      Fill: =AppTheme.NearWhite
      LoadingSpinnerColor: =AppTheme.DarkBlue
      OnVisible: |
        =Set(varVorgesetzter, IfError('Office365-Benutzer'.ManagerV2(User().EntraObjectId), Blank()))
    Children:
      - Container_Header_A:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =AppTheme.OffWhite
            Height: =32
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingLeft: =12
            PaddingRight: =12
            Width: =Parent.Width
          Children:
            - Label_AppTitle_A:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =AppTheme.DarkGray
                  Size: =11
                  Text: ="Neuer Antrag"
                  Width: =Parent.Width
      - Container_Content_A:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =AppTheme.NearWhite
            Height: =Parent.Height - Container_Header_A.Height
            Width: =Parent.Width
            Y: =32
          Children:
            - Card_Antrag:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =AppTheme.PaleGray
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =AppTheme.White
                  Height: =620
                  Width: =620
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =20
                Children:
                  - lblAntragHeading:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkBlue
                        FontWeight: =FontWeight.Bold
                        Height: =30
                        Size: =18
                        Text: ="Bestellanforderung"
                        Width: =400
                        X: =24
                        Y: =16
                  - lblFachbereichLabel:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkGray
                        Height: =35
                        Text: ="Fachbereich *"
                        Width: =130
                        X: =24
                        Y: =64
                  - ddFachbereich:
                      Control: ModernDropdown@1.0.3
                      Properties:
                        Fill: =AppTheme.OffWhite
                        Height: =35
                        ItemDisplayText: =ThisItem.Value
                        Items: =["Produktion", "Qualität", "Beschaffung", "Instandhaltung", "Logistik", "Verwaltung"]
                        Width: =420
                        X: =164
                        Y: =64
                  - lblArtikelnummerLabel:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkGray
                        Height: =35
                        Text: ="Artikelnummer *"
                        Width: =130
                        X: =24
                        Y: =106
                  - txtArtikelnummer:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        Fill: =AppTheme.OffWhite
                        Height: =35
                        Placeholder: ="Artikelnummer"
                        Width: =420
                        X: =164
                        Y: =106
                  - lblStueckzahlLabel:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkGray
                        Height: =35
                        Text: ="Stückzahl *"
                        Width: =130
                        X: =24
                        Y: =148
                  - txtStueckzahl:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        Fill: =AppTheme.OffWhite
                        Height: =35
                        Placeholder: ="0"
                        Width: =200
                        X: =164
                        Y: =148
                  - lblWertLabel:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkGray
                        Height: =35
                        Text: ="Wert (€) *"
                        Width: =130
                        X: =24
                        Y: =190
                  - txtWert:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        Fill: =AppTheme.OffWhite
                        Height: =35
                        Placeholder: ="0,00"
                        Width: =200
                        X: =164
                        Y: =190
                  - lblWegHinweis:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.MidGray
                        Height: =35
                        Size: =10
                        Text: |-
                          =If(
                              IfError(Value(txtWert.Text), 0) > 5000,
                              "FK → Geschäftsführung → MaWi",
                              "FK → MaWi"
                          )
                        Width: =210
                        X: =374
                        Y: =190
                  - lblKostenstelleLabel:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkGray
                        Height: =35
                        Text: ="Kostenstelle"
                        Width: =130
                        X: =24
                        Y: =232
                  - txtKostenstelle:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        Fill: =AppTheme.OffWhite
                        Height: =35
                        Placeholder: ="Kostenstelle"
                        Width: =200
                        X: =164
                        Y: =232
                  - lblLagerortLabel:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkGray
                        Height: =35
                        Text: ="Wo liegt die Ware"
                        Width: =130
                        X: =24
                        Y: =274
                  - txtLagerort:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        Fill: =AppTheme.OffWhite
                        Height: =35
                        Placeholder: ="Lagerort"
                        Width: =420
                        X: =164
                        Y: =274
                  - lblVorgesetzterLabel:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkGray
                        Height: =35
                        Text: ="Vorgesetzter"
                        Width: =130
                        X: =24
                        Y: =316
                  - lblVorgesetzterWert:
                      Control: Label@2.5.1
                      Properties:
                        Color: =If(IsBlank(varVorgesetzter.mail), AppTheme.LightRed, AppTheme.DarkGray)
                        Height: =35
                        Text: =If(IsBlank(varVorgesetzter.mail), "Kein Vorgesetzter im AD hinterlegt", varVorgesetzter.displayName)
                        Width: =420
                        X: =164
                        Y: =316
                  - lblDateienLabel:
                      Control: Label@2.5.1
                      Properties:
                        Color: =AppTheme.DarkGray
                        Height: =35
                        Text: ="Dateien"
                        Width: =130
                        X: =24
                        Y: =358
                  - btnAbsenden:
                      Control: ModernButton@1.0.0
                      Properties:
                        BasePaletteColor: =AppTheme.DarkBlue
                        DisplayMode: |-
                          =If(
                              !IsBlank(ddFachbereich.Selected.Value)
                                  && !IsBlank(Trim(txtArtikelnummer.Text))
                                  && IfError(Value(txtStueckzahl.Text), 0) > 0
                                  && IfError(Value(txtWert.Text), 0) > 0
                                  && !IsBlank(varVorgesetzter.mail),
                              DisplayMode.Edit,
                              DisplayMode.Disabled
                          )
                        Height: =35
                        OnSelect: |-
                          =Set(
                              varAntrag,
                              Patch(
                                  Antraege,
                                  Defaults(Antraege),
                                  {
                                      Titel: Trim(txtArtikelnummer.Text),
                                      Fachbereich: {Value: ddFachbereich.Selected.Value},
                                      Artikelnummer: Trim(txtArtikelnummer.Text),
                                      Stueckzahl: Value(txtStueckzahl.Text),
                                      Wert: Value(txtWert.Text),
                                      Kostenstelle: Trim(txtKostenstelle.Text),
                                      Lagerort: Trim(txtLagerort.Text),
                                      Status: {Value: "Wartet auf FK"},
                                      Antragsteller: {
                                          Claims: "i:0#.f|membership|" & User().Email,
                                          Department: "",
                                          DisplayName: User().FullName,
                                          Email: User().Email,
                                          JobTitle: "",
                                          Picture: ""
                                      },
                                      Vorgesetzter: {
                                          Claims: "i:0#.f|membership|" & varVorgesetzter.userPrincipalName,
                                          Department: "",
                                          DisplayName: varVorgesetzter.displayName,
                                          Email: varVorgesetzter.mail,
                                          JobTitle: "",
                                          Picture: ""
                                      }
                                  }
                              )
                          );
                          Notify("Antrag eingereicht.", NotificationType.Success);
                          Reset(ddFachbereich);
                          Reset(txtArtikelnummer);
                          Reset(txtStueckzahl);
                          Reset(txtWert);
                          Reset(txtKostenstelle);
                          Reset(txtLagerort);
                          Navigate(scrMeineAntraege, ScreenTransition.Fade)
                        Text: ="Antrag absenden"
                        Width: =200
                        X: =164
                        Y: =560
                  - btnZuruecksetzen:
                      Control: ModernButton@1.0.0
                      Properties:
                        BasePaletteColor: =AppTheme.MidGray
                        Height: =35
                        OnSelect: |-
                          =Reset(ddFachbereich);
                          Reset(txtArtikelnummer);
                          Reset(txtStueckzahl);
                          Reset(txtWert);
                          Reset(txtKostenstelle);
                          Reset(txtLagerort)
                        Text: ="Zurücksetzen"
                        Width: =200
                        X: =384
                        Y: =560
            - btnNavAntrag_A:
                Control: ModernButton@1.0.0
                Properties:
                  BasePaletteColor: =AppTheme.DarkBlue
                  Height: =35
                  OnSelect: =Navigate(scrAntrag, ScreenTransition.Fade)
                  Text: ="Neuer Antrag"
                  Width: =250
                  X: =10
                  Y: =30
            - btnNavMeine_A:
                Control: ModernButton@1.0.0
                Properties:
                  BasePaletteColor: =AppTheme.LightBlue
                  Height: =35
                  OnSelect: =Navigate(scrMeineAntraege, ScreenTransition.Fade)
                  Text: ="Meine Anträge"
                  Width: =250
                  X: =10
                  Y: =70
            - btnNavFreigaben_A:
                Control: ModernButton@1.0.0
                Properties:
                  BasePaletteColor: =AppTheme.LightBlue
                  Height: =35
                  OnSelect: =Navigate(scrFreigaben, ScreenTransition.Fade)
                  Text: ="Freigaben"
                  Width: =250
                  X: =10
                  Y: =110
